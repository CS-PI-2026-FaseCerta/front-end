<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaseCerta | Gerencie o seu negocio com Inteligência</title>
    <link rel="stylesheet" href="css/header.css" />
    <link href="https://fonts.googleapis.com" rel="stylesheet" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="navbar-inner">
          <div class="logo">
            <div class="logo-icon">
              <img src="assets/img/icon.png" alt="" />
            </div>
            <span> FaseCerta </span>
          </div>
          <div class="navlinks">
            <a href="#recursos">Recursos</a>
            <a href="#precos">Preços</a>
            <a href="#equipe">Sobre</a>
            <a href="#faq">FAQ</a>
          </div>
          <div>
            <a class="btn" href="">Começar Agora</a>
          </div>
          <button class="btn-menu" onclick="abrirMenu()">
            <img src="assets/img/menu_icon.png" alt="menu_icon" />
          </button>
        </div>
        <div class="m-navlinks" id="m-navlinks">
          <a href="#recursos">Recursos</a>
          <a href="#precos">Preços</a>
          <a href="#equipe">Sobre</a>
          <a href="#faq">FAQ</a>
        </div>
      </nav>
    </header>
    <main>
      <!-- HERO -->
      <section class="hero">
        <div class="hero-text">
          <h1>
            Controle seu negócio com
            <span style="color: #5600b2">Inteligência</span>
          </h1>
          <p>
            Simplifique a gestão do seu negócio com relatórios automáticos,
            controle de entrada e saída em tempo real e integração total com
            seus canais de venda.
          </p>
        </div>
        <div class="hero-action">
          <a class="btn" href="">
            Começar Agora
            <img
              style="width: 1rem; height: 1rem"
              src="assets/img/seta.png"
              alt="seta-para-direita"
            />
          </a>
          <a
            class="btn-video"
            href="https://www.youtube.com/watch?v=nMpH7k0NPeI"
          >
            Ver Demonstração
            <img
              style="width: 1.25rem; height: 1.25rem"
              src="assets/img/play.png"
              alt="play"
            />
          </a>
        </div>
        <div class="bolinhas-daniel"></div>
        <div class="carrossel">
          <img src="assets/img/sistema.png" alt="" />
        </div>
      </section>
    </main>
    <footer></footer>

    <script src="js/header.js"></script>
  </body>
</html>
