<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaseCerta | Gerencie o seu negocio com Inteligência</title>
    <link rel="stylesheet" href="css/header.css" />
    <link href="https://fonts.googleapis.com" rel="stylesheet" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="navbar-inner">
          <div class="logo">
            <div class="logo-icon">
              <img src="assets/img/icons/icon.png" alt="" />
            </div>
            <span> FaseCerta </span>
          </div>
          <div class="navlinks">
            <a href="#recursos">Recursos</a>
            <a href="#precos">Preços</a>
            <a href="#equipe">Sobre</a>
            <a href="#faq">FAQ</a>
          </div>
          <div>
            <a class="btn" href="#contato">Começar Agora</a>
          </div>
          <button class="btn-menu" onclick="abrirMenu()">
            <img src="assets/img/icons/menu_icon.png" alt="menu_icon" />
          </button>
        </div>
        <div class="m-navlinks" id="m-navlinks">
          <a href="#recursos">Recursos</a>
          <a href="#precos">Preços</a>
          <a href="#equipe">Sobre</a>
          <a href="#faq">FAQ</a>
        </div>
      </nav>
    </header>
    <main>
      <!-- HERO -->
      <div class="content-hero recursos">
        <section class="hero">
          <div class="hero-text">
            <h1>
              Controle seu negócio com
              <span style="color: #5600b2">Inteligência</span>
            </h1>
            <p>
              Simplifique a gestão do seu negócio com relatórios automáticos,
              controle de entrada e saída em tempo real e integração total com
              seus canais de venda.
            </p>
            <div class="hero-action">
              <a class="btn" href="#contato">
                Começar Agora
                <img
                  style="width: 1rem; height: 1rem"
                  src="assets/img/icons/seta.png"
                  alt="seta-para-direita"
                />
              </a>
              <a
                class="btn-video"
                href="https://www.youtube.com/watch?v=nMpH7k0NPeI"
              >
                Ver Demonstração
                <img
                  style="width: 1.25rem; height: 1.25rem"
                  src="assets/img/icons/play.png"
                  alt="play"
                />
              </a>
            </div>
          </div>

          <div class="carrossel">
            <div class="carrossel-board">
              <div class="bolinha" style="background: #f87171"></div>
              <div class="bolinha" style="background: #fbbf24"></div>
              <div class="bolinha" style="background: #34d399"></div>
            </div>
            <div class="carrossel-viewport">
              <figure class="carrossel-slide">
                <img
                  src="assets/img/carrossel/image01.png"
                  alt="Imagem promocional: mostra o numero de contato que e 4002 8922"
                />
              </figure>
              <figure class="carrossel-slide">
                <img src="assets/img/carrossel/image02.png" alt="Tela do app" />
              </figure>
              <figure class="carrossel-slide">
                <img src="assets/img/carrossel/image03.png" alt="Tela do app" />
              </figure>
              <figure class="carrossel-slide">
                <img src="assets/img/carrossel/image04.png" alt="Tela do app" />
              </figure>
            </div>
          </div>
        </section>
      </div>
    </main>
    <footer></footer>

    <script src="js/header.js"></script>
  </body>
</html>
