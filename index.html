<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaseCerta - Crie sua conta</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>

<body>

    <nav class="navbar">
        <div class="logo">FaseCerta</div>
    </nav>

    <main class="main-content">
        <div class="card">
            <h1>Crie sua conta</h1>
            <p class="subtitle">Insira seus dados para começar</p>

            <form id="registerForm">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com">
                </div>

                <div class="input-group">
                    <label for="username">Nome de Usuário</label>
                    <input type="text" id="username" placeholder="Como quer ser chamado?">
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="password">
                        <i class="far fa-eye toggle-password"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirme sua senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm-password">
                        <i class="far fa-eye toggle-password"></i>
                    </div>
                    <span class="info-text"><i class="fas fa-info-circle"></i> As senhas devem coincidir para
                        prosseguir.</span>
                </div>

                <button type="submit" class="btn-primary" disabled>Criar conta!</button>
            </form>

            <div class="login-link">
                <p>Já tem conta? <a href="#">Entre Aqui</a></p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-left">
            <strong>FaseCerta</strong>
            <span>© 2024 FaseCerta.</span>
        </div>
        <div class="footer-right">
            <a href="#">Suporte</a>
            <a href="#">Termos de Uso</a>
            <a href="#">Política de Privacidade</a>
        </div>
    </footer>

    <script src="js/cadastro.js"></script>
</body>
</html>
