<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaseCerta - Cadastrar Peça/Material</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">FaseCerta</div>
    </nav>

    <main class="main-content">
        <div class="card wide-card">
            <div class="card-header">
                <a href="#" class="back-button"><i class="fas fa-arrow-left"></i></a>
                <h1>Cadastrar Peça/Material</h1>
            </div>

            <form id="registerForm">
                <div class="input-group">
                    <label for="nome-da-peca">NOME DA PEÇA</label>
                    <input type="text" id="nome-da-peca" placeholder="Ex: Filtro de Óleo Magneti Marelli">
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="custo">CUSTO (R$)</label>
                        <div class="input-wrapper prefix">
                            <span class="currency-prefix">R$</span>
                            <input type="text" id="custo" placeholder="0,00">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="preco-venda">PREÇO FINAL DE VENDA (R$)</label>
                        <div class="input-wrapper prefix">
                            <span class="currency-prefix">R$</span>
                            <input type="text" id="preco-venda" placeholder="0,00">
                        </div>
                    </div>
                </div>



                <button type="submit" class="btn-primary btn-submit">CADASTRAR PEÇA/MATERIAL</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-left">
            <span>FaseCerta © 2026</span>
        </div>
        <div class="footer-right">
            <a href="#">Suporte</a>
            <a href="#">Termos de Uso</a>
            <a href="#">Política de Privacidade</a>
        </div>
    </footer>

    <script src="js/script.js" defer></script>
</body>

</html>
